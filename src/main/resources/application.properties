spring.application.name=SmartLogix



spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flyway can start on an existing database
spring.flyway.baseline-on-migrate=true
#  to prevent accidental data loss
spring.flyway.clean-disabled=true
# Allows Flyway to run a V2026...1200 even if V2026...1205 is already in the DB
spring.flyway.out-of-order=true



# 'validate' ensures Flyway tables match your Java @Entity classes
spring.jpa.hibernate.ddl-auto=validate
# It closes the database connection as soon as the service layer is done (no longer open connection)
spring.jpa.open-in-view=false 
spring.jpa.properties.hibernate.format_sql=true


